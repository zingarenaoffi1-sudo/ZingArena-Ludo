name: Build Zing Arena APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check project
        run: |
          node --version
          npm --version
          echo "Project files:"
          ls -la

      - name: Install npm dependencies
        run: npm install

      - name: Prepare web directory
        run: |
          rm -rf www
          mkdir -p www

          cp index.html www/
          cp style.css www/
          cp script.js www/

          [ -f local.html ] && cp local.html www/ || true
          [ -f local.js ] && cp local.js www/ || true
          [ -f online.html ] && cp online.html www/ || true

          echo "www contents:"
          find www -maxdepth 2 -type f -print

      - name: Install Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor config if missing
        run: |
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.zingarena.ludo",
            "appName": "Zing Arena",
            "webDir": "www"
          }
          EOF
          fi

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync web files to Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZingArena-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
