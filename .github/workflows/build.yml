name: Build Ludo APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets --save-dev
          mkdir -p www
          rsync -a --exclude=www --exclude=node_modules --exclude=.git --exclude=.github ./ ./www/
          npx cap init "Zing Ludo" "com.zingarena.ludo" --web-dir www
          npx cap add android
          mkdir -p assets
          cp icon.png assets/icon.png
          npx capacitor-assets generate --android

      - env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Djava.net.preferIPv4Stack=true"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace --info
          
      - uses: actions/upload-artifact@v4
        with:
          name: ZingLudo-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
