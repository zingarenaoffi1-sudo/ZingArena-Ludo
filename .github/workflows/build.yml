name: Build Ludo APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 🔥 Change 1: Java ka engine badal diya (Zulu lagaya hai)
      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 🔥 Change 2: GitHub ka pre-installed kachra zabardasti delete kar rahe hain
      - name: Force Clean Gradle Cache
        run: rm -rf ~/.gradle/caches/ || true

      - name: Install & Setup Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets --save-dev
          
          mkdir -p www
          rsync -a --exclude=www --exclude=node_modules --exclude=.git --exclude=.github ./ ./www/
          
          npx cap init "Zing Ludo" "com.zingarena.ludo" --web-dir www
          npx cap add android
          
          mkdir -p assets
          cp icon.png assets/icon.png
          npx capacitor-assets generate --android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          # 🔥 Change 3: --refresh-dependencies lagaya hai taaki fresh download ho
          ./gradlew clean assembleDebug --no-daemon --refresh-dependencies

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZingLudo-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
