name: Build Ludo APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 🔥 PRO FIX 1: Official Gradle plugin lagaya hai taaki environment theek rahe
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install & Setup Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm install @capacitor/assets --save-dev
          
          mkdir www
          rsync -a --exclude=www --exclude=node_modules --exclude=.git --exclude=.github ./ ./www/
          
          npx cap init "Zing Ludo" "com.zingarena.ludo" --web-dir www
          npx cap add android
          
          mkdir -p assets
          cp icon.png assets/icon.png
          npx capacitor-assets generate --android

      # 🔥 PRO FIX 2: Build se pehle server ka saara corrupted kachra delete!
      - name: Wipe Corrupted Cache
        run: rm -rf ~/.gradle/caches/ || true

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          # 🔥 PRO FIX 3: --max-workers=1 lagaya hai taaki server ek sath 2 kaam karke atke nahi
          ./gradlew clean assembleDebug --no-daemon --max-workers=1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZingLudo-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
