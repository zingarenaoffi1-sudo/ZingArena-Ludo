name: Build Zing Arena APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check package.json
        run: |
          echo "Using existing package.json:"
          cat package.json
          echo ""
          echo "Project files:"
          ls -la

      - name: Install dependencies
        run: npm install

      - name: Prepare www
        run: |
          rm -rf www
          mkdir -p www

          cp index.html www/
          cp style.css www/
          cp script.js www/

          if [ -f local.html ]; then cp local.html www/; fi
          if [ -f local.js ]; then cp local.js www/; fi
          if [ -f online.html ]; then cp online.html www/; fi

          if [ -f icon.png ]; then cp icon.png www/; fi

          echo "WWW:"
          find www -maxdepth 1 -type f -print

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor config
        run: |
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.zingarena.ludo",
            "appName": "Zing Arena",
            "webDir": "www"
          }
          EOF
          fi

      - name: Add Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZingArena-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
