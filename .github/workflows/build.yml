name: Build Ludo APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install & Setup Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # Game files ko ek alag folder mein pack kar raha hai
          mkdir www
          rsync -a --exclude=www --exclude=node_modules --exclude=.git --exclude=.github ./ ./www/
          
          # Capacitor aur Android App initialize karna
          npx cap init "Zing Ludo" "com.zingarena.ludo" --web-dir www
          npx cap add android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: ZingLudo-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
