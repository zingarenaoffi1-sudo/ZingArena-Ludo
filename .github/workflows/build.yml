name: Build Ludo APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets --save-dev
          mkdir -p www
          rsync -a --exclude=www --exclude=node_modules --exclude=.git --exclude=.github ./ ./www/
          npx cap init "Zing Ludo" "com.zingarena.ludo" --web-dir www
          npx cap add android
          mkdir -p assets
          cp icon.png assets/icon.png
          npx capacitor-assets generate --android

      - run: |
          cd android
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.vfs.watch=false" >> gradle.properties
          echo "org.gradle.caching=false" >> gradle.properties
          chmod +x gradlew
          ./gradlew clean assembleDebug --max-workers=1 --refresh-dependencies

      - uses: actions/upload-artifact@v4
        with:
          name: ZingLudo-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
