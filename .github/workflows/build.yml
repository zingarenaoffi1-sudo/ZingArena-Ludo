name: Build ZingArena APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check versions
        run: |
          node --version
          npm --version
          java -version

      - name: Install dependencies
        run: npm ci

      - name: Prepare www
        run: |
          rm -rf www
          mkdir -p www

          rsync -a \
            --exclude='www' \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='android' \
            ./ ./www/

      - name: Install Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "ZingArena" "com.zingarena.app" --web-dir www
          npx cap add android

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Configure Gradle
        run: |
          cd android

          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.caching=false" >> gradle.properties

          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --max-workers=2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZingArena-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
